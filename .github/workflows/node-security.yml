name: Node.js Security

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: node-security-${{ github.workflow }}-${{ github.ref }}

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            client

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "client/.node-version"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
