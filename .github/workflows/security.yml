name: Rust Security

on:
  push:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --locked --format-version 1 > cargo-metadata.json

          set +e
          cargo audit --json > audit-report.json
          audit_exit=$?
          set -e

          python3 - <<'PY'
          import json
          import os
          import sys

          with open("cargo-metadata.json", encoding="utf-8") as file:
              metadata = json.load(file)

          with open("audit-report.json", encoding="utf-8") as file:
              report = json.load(file)

          workspace_members = set(metadata.get("workspace_members", []))
          direct_dependencies = set()
          for package in metadata.get("packages", []):
              if package.get("id") not in workspace_members:
                  continue
              for dependency in package.get("dependencies", []):
                  # Vulnerabilities in build/dev dependencies are also
                  # relevant to the workspace's dependency graph.
                  direct_dependencies.add(dependency["name"])

          direct_fixable = []
          transitive = []
          unfixable = []
          for finding in report.get("vulnerabilities", {}).get("list", []):
              advisory = finding["advisory"]
              patched = finding.get("versions", {}).get("patched", [])
              target = f"{advisory['id']} ({advisory['package']})"
              if patched:
                  item = (target, ", ".join(patched))
                  if advisory["package"] in direct_dependencies:
                      direct_fixable.append(item)
                  else:
                      transitive.append(item)
              else:
                  unfixable.append(target)

          warnings = report.get("warnings", {})
          blocking_warnings = {
              kind: entries
              for kind, entries in warnings.items()
              if kind in {"unsound", "yanked"} and entries
          }

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as file:
                  file.write("## Cargo audit\n\n")
                  if unfixable:
                      file.write("### Reported only (no patched release)\n")
                      for finding in unfixable:
                          file.write(f"- `{finding}`\n")
                      file.write("\n")
                  if transitive:
                      file.write("### Reported only (transitive dependency)\n")
                      for finding, patched in transitive:
                          file.write(f"- `{finding}`; patched: `{patched}`\n")
                      file.write("\n")
                  if direct_fixable:
                      file.write("### Must fix (direct dependency)\n")
                      for finding, patched in direct_fixable:
                          file.write(f"- `{finding}`; patched: `{patched}`\n")
                      file.write("\n")

          if direct_fixable or blocking_warnings:
              print("Fixable advisories in direct dependencies found:")
              for finding, patched in direct_fixable:
                  print(f"- {finding}; patched: {patched}")
              for finding, patched in transitive:
                  print(f"Reported only (transitive): {finding}; patched: {patched}")
              for kind, entries in blocking_warnings.items():
                  print(f"Blocking {kind} warnings found: {len(entries)}")
              sys.exit(1)

          print("No fixable advisories in direct dependencies were found.")
          if transitive:
              print("Transitive advisories were retained in audit-report.json.")
          if unfixable:
              print("Unfixable advisories were retained in audit-report.json.")
          PY

          if [ "$audit_exit" -ne 0 ] && [ ! -s audit-report.json ]; then
            exit "$audit_exit"
          fi

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: server/audit-report.json
